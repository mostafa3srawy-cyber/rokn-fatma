name: unpack
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  u:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unpack zips
        run: |
          if ls *.zip >/dev/null 2>&1; then
            for z in *.zip; do unzip -o "$z"; done
            rm -f *.zip
            git config user.name unpack
            git config user.email unpack@users.noreply.github.com
            git add -A
            git commit -m "Unpack site files"
            git push
          fi
